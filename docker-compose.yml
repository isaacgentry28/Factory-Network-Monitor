# docker-compose.yml - all EdgeGuard services on the HMI Pi
#   Start/rebuild everything:  docker compose up -d --build
#   Live logs:                 docker compose logs -f            (or: logs -f ingest)
#   Status:                    docker compose ps
#   Stop everything:           docker compose down
# restart: unless-stopped + Docker enabled at boot = everything comes back after a reboot.
services:
  controller:
    build:
      context: .
      dockerfile: hmi/Dockerfile
    image: edgeguard-controller
    container_name: edgeguard-controller
    restart: unless-stopped                 # FR-6.6
    network_mode: bridge                    # NFR-3.4: Docker's default bridge
    env_file:
      - common/config.env
      - common/secrets.env
    environment:
      CONTROL_BIND: 0.0.0.0
      CONTROLLER_STATE_FILE: /app/data/controller_state.json
    ports:
      - "5020:5020"                         # S3 from the Sense HAT Pi (FR-6.3)
      - "127.0.0.1:5070:5070"               # S8, localhost only (FR-6.4)
    volumes:
      - controller-data:/app/data

  ingest:
    build:
      context: .
      dockerfile: hmi/Dockerfile.app
    image: edgeguard-hmi-app
    container_name: edgeguard-ingest
    command: ["python3", "-m", "hmi.hmi_ingest"]
    restart: unless-stopped
    network_mode: host                      # S1/S5 on the Pi's ports; relay to 127.0.0.1:5075
    user: "1001:1001"                       # not root (NFR-2.4)
    env_file:
      - common/config.env
      - common/secrets.env                  # NAS login for the logger

  dashboard:
    build:
      context: .
      dockerfile: hmi/Dockerfile.app
    image: edgeguard-hmi-app                # same image as ingest
    container_name: edgeguard-dashboard
    command: ["python3", "-m", "hmi.dashboard"]
    restart: unless-stopped                 # keeps retrying until the desktop is up after boot
    network_mode: host                      # 127.0.0.1:5075 from ingest, 127.0.0.1:5070 to the controller
    user: "1001:1001"                       # same user as the Pi desktop, so X lets it draw
    environment:
      DISPLAY: ":0"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix       # the touchscreen's X display socket
    env_file:
      - common/config.env
    depends_on:
      - ingest

volumes:
  controller-data:
